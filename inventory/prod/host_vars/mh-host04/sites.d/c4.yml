    admin_user: "admin"
    civicrm_install: true
    modules_enable:
      - big_pipe
      - block
      - breakpoint
      - ckeditor5
      - config
      - datetime
      - dynamic_page_cache
      - editor
      - field
      - field_ui
      - file
      - filter
      - image
      - language
      - link
      - media
      - menu_link_content
      - menu_ui
      - mysql
      - node
      - options
      - page_cache
      - path
      - path_alias
      - responsive_image
      - search
      - syslog
      - system
      - taxonomy
      - text
      - toolbar
      - update
      - user
      - views
      - views_ui
      - address
      - block_visibility_groups
      - civicrm
      - civicrmtheme
      - civicrm_entity
      - commerce
      - commerce_cart
      - commerce_checkout
      - commerce_number_pattern
      - commerce_order
      - commerce_payment
      - commerce_price
      - commerce_product
      - commerce_promotion
      - commerce_store
      - commerce_tax
      - commerce_barion_payment
      - commerce_email
      - commerce_paypal
      - commerce_shipping
      - entity
      - entity_reference_revisions
      - element_class_formatter
