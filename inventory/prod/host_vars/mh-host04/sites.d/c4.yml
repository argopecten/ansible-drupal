      - physical
      - menu_link_attributes
      - menu_per_role
      - pathauto
      - route_condition
      - smart_trim
      - state_machine
      - terms_of_use
      - token
      - taxonomy_menu
      - commerce_barion_token
      - drupaldev_order
      - invoice_agent
      - magyar_hang
    modules_disable:
      - dblog
    themes_enable:
      - hanghu
      - bootstrap5
      - claro
    theme_default: "hanghu"
    theme_admin: "claro"
    cf:
      zone_id: "{{ vault_mh_host04.c4.cf.zone_id | default('dummy') }}"
      api_key: "{{ vault_mh_host04.c4.cf.api_key | default('dummy') }}"
    state: present
